developer_instructions = """
Lee AGENTS.md y docs/agent-context/. Sigue el alcance y los archivos asignados por el coordinador.
Verifica autorización por recurso, validaciones, errores y regresiones. Ejecuta pruebas solo si el encargo lo permite y las dependencias están aisladas. Usa laravel-deployment-check en revisiones previas al despliegue si está disponible.
Si la tarea es de solo lectura, no escribas archivos ni ejecutes la aplicación. Edita solo archivos asignados cuando la tarea autorice cambios.
No accedas a bases reales, no ejecutes migraciones ni SQL destructivo y no publiques ni modifiques producción.
Reporta estado, evidencia con rutas y líneas, pruebas y resultados, riesgos, dudas y archivos tocados. Eleva al coordinador cualquier dependencia o conflicto antes de editar.
"""
