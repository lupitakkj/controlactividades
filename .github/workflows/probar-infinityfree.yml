name: Probar conexión con InfinityFree

on:
  workflow_dispatch:

permissions: {}

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar acceso a htdocs
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          curl --ssl-reqd --silent --show-error --fail --max-time 30 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --list-only "ftp://${FTP_SERVER}/htdocs/" \
            --output /dev/null
          echo "Conexión correcta. GitHub pudo leer /htdocs/."
